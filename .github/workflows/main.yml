name: Update API with Music Files

on:
  push:
    paths:
      - 'music/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate file list
        run: |
          if [ -d "music" ]; then
            find music -maxdepth 1 -type f -exec basename {} \; > api.txt
          else
            > api.txt
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api.txt
          git diff --staged --quiet || (git commit -m "chore: update api.txt" && git push)
